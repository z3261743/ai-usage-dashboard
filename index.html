<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent 用量日报</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d2e;
    --border: #2a2d3e;
    --text: #e1e4f0;
    --muted: #8b8fa3;
    --accent: #6c8cff;
    --green: #4ade80;
    --orange: #fb923c;
    --red: #f87171;
    --purple: #a78bfa;
    --teal: #2dd4bf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  
  /* Header */
  header {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 32px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 24px; font-weight: 600; }
  h1 small { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 8px; }
  .last-update { font-size: 12px; color: var(--muted); }

  /* Summary cards */
  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px; margin-bottom: 28px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .cost { color: var(--accent); }
  .tokens { color: var(--green); }
  .sessions { color: var(--teal); }

  /* Charts */
  .chart-grid {
    display: grid; grid-template-columns: 2fr 1fr;
    gap: 16px; margin-bottom: 28px;
  }
  .chart-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .chart-box h3 { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .chart-box.full { grid-column: 1 / -1; }
  .chart-box canvas { max-height: 320px; }

  /* Table */
  .table-wrap {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); font-weight: 500; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  .model-badge {
    display: inline-block; padding: 1px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 500;
  }
  .badge-pro { background: rgba(108,140,255,.15); color: var(--accent); }
  .badge-flash { background: rgba(74,222,128,.15); color: var(--green); }
  .badge-gemini { background: rgba(251,146,60,.15); color: var(--orange); }
  .badge-unknown { background: rgba(139,143,163,.15); color: var(--muted); }

  @media (max-width: 768px) {
    .chart-grid { grid-template-columns: 1fr; }
    body { padding: 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>🤖 AI 用量日报 <small>Hermes Agent</small></h1>
    </div>
    <div class="last-update" id="updateTime"></div>
  </header>

  <div class="cards" id="summaryCards"></div>

  <div class="chart-grid">
    <div class="chart-box">
      <h3>📊 每日费用（近30天）</h3>
      <canvas id="costChart"></canvas>
    </div>
    <div class="chart-box">
      <h3>🧩 按模型占比</h3>
      <canvas id="modelChart"></canvas>
    </div>
    <div class="chart-box full">
      <h3>📈 Token 用量（近30天）</h3>
      <canvas id="tokenChart"></canvas>
    </div>
  </div>

  <div class="table-wrap" id="dailyTable">
    <h3 style="font-size:14px;color:var(--muted);margin-bottom:12px;">📋 每日明细</h3>
    <table>
      <thead>
        <tr>
          <th>日期</th>
          <th>会话</th>
          <th>消息</th>
          <th>工具调用</th>
          <th>输入 Tokens</th>
          <th>输出 Tokens</th>
          <th>模型</th>
          <th>费用</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
async function main() {
  const res = await fetch('data.json');
  const data = await res.json();

  document.getElementById('updateTime').textContent = '更新于 ' + data.generated_at;

  // Summary cards
  const s = data.summary;
  const cards = document.getElementById('summaryCards');
  cards.innerHTML = `
    <div class="card"><div class="label">近7天费用</div><div class="value cost">$${s.total_cost_7d.toFixed(4)}</div><div class="sub">$${s.avg_daily_cost_7d.toFixed(4)}/天</div></div>
    <div class="card"><div class="label">近30天费用</div><div class="value cost">$${s.total_cost_30d.toFixed(4)}</div></div>
    <div class="card"><div class="label">日均输入 Tokens</div><div class="value tokens">${fmtNum(s.avg_daily_input_tokens)}</div></div>
    <div class="card"><div class="label">日均输出 Tokens</div><div class="value tokens">${fmtNum(s.avg_daily_output_tokens)}</div></div>
  `;

  const daily = data.daily;

  // Cost chart (last 30)
  const last30 = daily.slice(-30);
  Chart.defaults.color = '#8b8fa3';
  Chart.defaults.borderColor = '#2a2d3e';

  new Chart(document.getElementById('costChart'), {
    type: 'bar',
    data: {
      labels: last30.map(d => d.date.slice(5)),
      datasets: [{
        label: '费用 (USD)',
        data: last30.map(d => d.computed_cost),
        backgroundColor: '#6c8cff',
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => '$' + v.toFixed(3) } }
      }
    }
  });

  // Token chart
  new Chart(document.getElementById('tokenChart'), {
    type: 'bar',
    data: {
      labels: last30.map(d => d.date.slice(5)),
      datasets: [
        { label: '输入 Tokens', data: last30.map(d => d.input_tokens), backgroundColor: '#4ade80', borderRadius: 4 },
        { label: '输出 Tokens', data: last30.map(d => d.output_tokens), backgroundColor: '#6c8cff', borderRadius: 4 },
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { boxWidth: 12, padding: 16 } } },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => fmtNum(v) } },
        x: { stacked: false }
      }
    }
  });

  // Model pie chart
  const modelTotals = {};
  daily.forEach(d => {
    for (const [m, stats] of Object.entries(d.models)) {
      modelTotals[m] = (modelTotals[m] || 0) + stats.cost;
    }
  });
  const modelColors = {
    'deepseek-v4-pro': '#6c8cff',
    'deepseek-v4-flash': '#4ade80',
    'gemini-3.5-flash': '#fb923c',
    'gemini-2.5-flash': '#fb923c',
  };
  new Chart(document.getElementById('modelChart'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(modelTotals).map(k => k + ' ($' + modelTotals[k].toFixed(3) + ')'),
      datasets: [{
        data: Object.values(modelTotals),
        backgroundColor: Object.keys(modelTotals).map(k => modelColors[k] || '#a78bfa'),
        borderWidth: 0,
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { boxWidth: 10, padding: 12, font: { size: 11 } }
        }
      }
    }
  });

  // Table
  const tbody = document.getElementById('tableBody');
  daily.slice().reverse().slice(0, 30).forEach(d => {
    const models = Object.entries(d.models).map(([m, _]) =>
      `<span class="model-badge ${badgeClass(m)}">${m}</span>`
    ).join(' ');
    tbody.innerHTML += `<tr>
      <td>${d.date}</td>
      <td>${d.sessions}</td>
      <td>${d.messages}</td>
      <td>${d.tool_calls}</td>
      <td>${fmtNum(d.input_tokens)}</td>
      <td>${fmtNum(d.output_tokens)}</td>
      <td>${models}</td>
      <td style="color:var(--accent)">$${d.computed_cost.toFixed(4)}</td>
    </tr>`;
  });
}

function fmtNum(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return n.toString();
}

function badgeClass(m) {
  if (m.includes('pro')) return 'badge-pro';
  if (m.includes('flash')) return 'badge-flash';
  if (m.includes('gemini')) return 'badge-gemini';
  return 'badge-unknown';
}

main();
</script>
</body>
</html>
