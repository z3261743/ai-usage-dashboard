    <span>🕐 2026-11-20 08:00</span>
    <span>🔗 <a href="https://huggingface.co/blog/inkling2mini" target="_blank" rel="noopener">原文</a></span>

<div class="content">Inkling 2 Mini 是一款新型 looped transformer 模型，属于多模态 Mixture-of-Experts，物理总参数约 26B，每 token 激活参数 3B。它通过循环重复访问部分层三次来提升容量，效果相当于拥有更多参数。模型支持 1M-token 上下文，可接受图像和文本输入。Thinking Machines Lab 以混合精度格式发布，专家权重采用 NVFP4 和 MXFP8，并附带 DSpark drafter 以小幅内存开销换取额外加速。Inkling 2 Mini 远小于 Inkling 2 Small，专为本地 AI 环境设计，是一款令人耳目一新的优秀本地模型。</div>
