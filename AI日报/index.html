<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>AI 日报</title>
<style>/* 同上 serve_kb.py 的样式 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;color:#333;line-height:1.8;-webkit-text-size-adjust:100%}
.container{max-width:720px;margin:0 auto;padding:16px}
.header-bar{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.header-bar h1{font-size:1.2rem;font-weight:600}
.header-bar .subtitle{font-size:.8rem;opacity:.7}
.article{background:#fff;border-radius:12px;padding:24px 20px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin:16px 0}
.article h2{font-size:1.15rem;color:#1a1a2e;margin-bottom:8px}
.article h2 a{color:#1a1a2e;text-decoration:none}
.article .source{font-size:.8rem;color:#888;margin-bottom:12px;display:flex;gap:12px}
.article img{max-width:100%;height:auto;border-radius:8px}
.article p{margin:8px 0}
.article a{color:#4a6cf7;word-break:break-all}
.article pre{background:#1e1e2e;color:#cdd6f4;padding:16px;border-radius:8px;overflow-x:auto;font-size:.85rem;margin:12px 0}
.article code{font-family:'SF Mono',Monaco,monospace;font-size:.9em}
.article blockquote{border-left:3px solid #4a6cf7;padding:8px 16px;margin:12px 0;background:#f0f3ff;border-radius:0 8px 8px 0;color:#555}
.index-link{display:inline-block;padding:10px 16px;background:#4a6cf7;color:#fff;border-radius:8px;text-decoration:none;font-size:.95rem;margin-bottom:16px}
.day-heading{font-size:1.3rem;color:#1a1a2e;padding:16px 0 8px;border-bottom:2px solid #4a6cf7;margin-bottom:16px}
</style>
</head>
